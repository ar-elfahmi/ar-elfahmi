<svg width="840" height="220" viewBox="0 0 840 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alfian Rasyid El Fahmi banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b2e"/>
      <stop offset="100%" stop-color="#1a1b27"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#f7768e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="840" height="220" fill="url(#bg)"/>

  <!-- starfield dots -->
  <g fill="#c0caf5">
    <circle cx="40"  cy="34"  r="1.1" opacity="0.85"/>
    <circle cx="96"  cy="180" r="1.0" opacity="0.5"/>
    <circle cx="150" cy="58"  r="0.9" opacity="0.6"/>
    <circle cx="210" cy="170" r="1.2" opacity="0.4"/>
    <circle cx="270" cy="40"  r="1.0" opacity="0.7"/>
    <circle cx="330" cy="188" r="0.8" opacity="0.55"/>
    <circle cx="395" cy="60"  r="1.1" opacity="0.45"/>
    <circle cx="460" cy="30"  r="0.9" opacity="0.7"/>
    <circle cx="520" cy="172" r="1.0" opacity="0.5"/>
    <circle cx="585" cy="48"  r="1.2" opacity="0.6"/>
    <circle cx="650" cy="186" r="0.9" opacity="0.55"/>
    <circle cx="715" cy="36"  r="1.1" opacity="0.75"/>
    <circle cx="775" cy="160" r="1.0" opacity="0.45"/>
    <circle cx="805" cy="72"  r="0.8" opacity="0.6"/>
    <circle cx="70"  cy="110" r="0.7" opacity="0.4"/>
    <circle cx="745" cy="112" r="0.7" opacity="0.5"/>
  </g>

  <!-- accent line -->
  <rect x="60" y="96" width="720" height="2" rx="1" fill="url(#line)"/>

  <!-- name -->
  <text x="420" y="76" text-anchor="middle" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="40" font-weight="700" letter-spacing="0.5" fill="url(#name)" filter="url(#glow)">Alfian Rasyid El Fahmi</text>

  <!-- subtitle -->
  <text x="420" y="132" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace" font-size="15" fill="#9aa5ce" letter-spacing="1.5">FULL-STACK &#8226; MOBILE &#8226; INFORMATICS ENGINEERING</text>

  <!-- focusing pill -->
  <g>
    <rect x="346" y="152" width="148" height="30" rx="15" fill="#1f2335" stroke="#bb9af7" stroke-opacity="0.55"/>
    <circle cx="364" cy="167" r="4.5" fill="#e0af68"/>
    <text x="378" y="172" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#c0caf5">&#127919; Focusing</text>
  </g>

  <!-- handle -->
  <text x="420" y="202" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#565f89">@ar-elfahmi &#8226; Surabaya, Indonesia</text>
</svg>
